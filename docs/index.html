<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Skeb Tracker</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<header>
		<h1>SKEB TRACKER</h1>
		<span class="meta" id="meta"></span>
	</header>

	<div class="stats-bar" id="stats-bar"></div>

	<div class="toolbar">
		<input type="search" id="search" placeholder="Filter by username …" spellcheck="false">
		<div class="toolbar-group">
			<label>Genre
				<select id="genre-filter">
					<option value="all">All</option>
					<option value="art" selected>Art</option>
					<option value="voice">Voice</option>
					<option value="novel">Novel</option>
					<option value="comic">Comic</option>
				</select>
			</label>
			<label>Min ¥
				<input type="number" id="price-min" placeholder="0" min="0" step="1000">
			</label>
			<label>Max ¥
				<input type="number" id="price-max" placeholder="∞" min="0" step="1000">
			</label>
			<button id="acceptable-filter" class="acceptable-btn">Accepting Requests</button>
		</div>
	</div>

	<div class="flag-bar" id="flag-bar"></div>

	<div class="table-wrap">
		<table>
			<thead>
				<tr>
					<th class="th-preview">Latest Works</th>
					<th data-sort="screen_name">User</th>
					<th data-sort="price">Price</th>
					<th data-sort="total_works">Works</th>
					<th data-sort="first_seen">First Seen</th>
					<th data-sort="last_updated">Updated</th>
				</tr>
			</thead>
			<tbody id="tbody">
				<tr>
					<td colspan="6" class="msg">Loading …</td>
				</tr>
			</tbody>
		</table>
	</div>

	<div class="pagination" id="pagination"></div>

	<script src="app.js"></script>
</body>

</html>
