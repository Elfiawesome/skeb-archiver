<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Bookmarks — Skeb Tracker</title>
	<style>
		/* ─── tokens (matching main site) ────────────────────────── */
		:root {
			--bg: #09090b;
			--surface: #18181b;
			--surface-2: #27272a;
			--border: #3f3f46;
			--border-lt: #27272a;
			--text: #fafafa;
			--text-2: #a1a1aa;
			--text-3: #71717a;
			--accent: #3b82f6;
			--accent-dim: #172554;
			--red: #ef4444;
			--green: #22c55e;
			--amber: #f59e0b;
			--font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
			--mono: "SF Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
		}

		/* ─── reset ──────────────────────────────────────────────── */
		*,
		*::before,
		*::after {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			border-radius: 0;
		}

		input,
		select,
		button,
		textarea {
			font-family: inherit;
			border-radius: 0;
			-webkit-appearance: none;
			appearance: none;
		}

		/* ─── base ───────────────────────────────────────────────── */
		html {
			height: 100%;
		}

		body {
			font-family: var(--font);
			font-size: 14px;
			line-height: 1.5;
			color: var(--text);
			background: var(--bg);
			-webkit-font-smoothing: antialiased;
			min-height: 100%;
		}

		/* ─── header ─────────────────────────────────────────────── */
		header {
			background: #000;
			padding: 14px 24px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			border-bottom: 1px solid var(--border);
		}

		header h1 {
			font-size: 12px;
			font-weight: 700;
			letter-spacing: .14em;
		}

		.header-links {
			display: flex;
			gap: 16px;
		}

		.header-links a {
			color: var(--text-3);
			text-decoration: none;
			font-size: 11px;
			font-family: var(--mono);
		}

		.header-links a:hover {
			color: var(--accent);
		}

		/* ─── toolbar ────────────────────────────────────────────── */
		.toolbar {
			background: var(--surface);
			border-bottom: 1px solid var(--border);
			padding: 10px 24px;
			display: flex;
			gap: 12px;
			align-items: center;
			flex-wrap: wrap;
		}

		.toolbar input[type="search"] {
			font-size: 13px;
			padding: 6px 10px;
			border: 1px solid var(--border);
			background: var(--bg);
			color: var(--text);
			width: 300px;
			outline: none;
		}

		.toolbar input[type="search"]::placeholder {
			color: var(--text-3);
		}

		.toolbar input[type="search"]:focus {
			border-color: var(--accent);
		}

		.toolbar-right {
			margin-left: auto;
			display: flex;
			gap: 8px;
			align-items: center;
		}

		.sort-btn {
			font-family: var(--mono);
			font-size: 10px;
			padding: 4px 10px;
			border: 1px solid var(--border);
			background: var(--bg);
			color: var(--text-3);
			cursor: pointer;
			white-space: nowrap;
			transition: all .12s;
		}

		.sort-btn:hover {
			border-color: var(--text-3);
			color: var(--text-2);
		}

		.sort-btn.active {
			border-color: var(--accent);
			color: var(--accent);
			background: var(--accent-dim);
		}

		/* ─── tag bar ────────────────────────────────────────────── */
		.tag-bar {
			background: var(--surface);
			border-bottom: 1px solid var(--border);
			padding: 6px 24px;
			display: flex;
			gap: 6px;
			align-items: center;
			flex-wrap: wrap;
		}

		.tag-bar:empty {
			display: none;
		}

		.tag-bar-label {
			font-size: 10px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: .06em;
			color: var(--text-3);
			margin-right: 4px;
		}

		.tag-btn {
			font-family: var(--mono);
			font-size: 10px;
			padding: 3px 10px;
			border: 1px solid var(--border);
			background: var(--bg);
			color: var(--text-3);
			cursor: pointer;
			text-transform: lowercase;
			letter-spacing: .02em;
			transition: all .12s;
		}

		.tag-btn:hover {
			border-color: var(--text-3);
			color: var(--text-2);
		}

		.tag-btn.active {
			border-color: var(--accent);
			color: var(--accent);
			background: var(--accent-dim);
		}

		/* ─── count bar ──────────────────────────────────────────── */
		.count-bar {
			background: var(--surface);
			border-bottom: 1px solid var(--border);
			padding: 6px 24px;
			font-size: 11px;
			color: var(--text-3);
			font-family: var(--mono);
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.count-bar strong {
			color: var(--text-2);
		}

		.skeb-status-msg {
			font-size: 10px;
		}

		/* ─── card grid ──────────────────────────────────────────── */
		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
			gap: 1px;
			background: var(--border-lt);
		}

		/* ─── card ───────────────────────────────────────────────── */
		.card {
			background: var(--bg);
			display: flex;
			flex-direction: column;
			overflow: hidden;
			transition: background .1s;
		}

		/* ─── carousel ───────────────────────────────────────────── */
		.carousel {
			position: relative;
			width: 100%;
			aspect-ratio: 4/3;
			background: var(--surface-2);
			overflow: hidden;
			cursor: zoom-in;
		}

		.carousel-img {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: contain;
			background: var(--surface-2);
			opacity: 0;
			transition: opacity .2s;
			pointer-events: none;
		}

		.carousel-img.active {
			opacity: 1;
			pointer-events: auto;
		}

		.carousel-nav {
			position: absolute;
			top: 50%;
			transform: translateY(-50%);
			background: rgba(0, 0, 0, .65);
			color: #fff;
			border: none;
			width: 28px;
			height: 40px;
			cursor: pointer;
			font-size: 16px;
			z-index: 2;
			opacity: 0;
			transition: opacity .15s;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.carousel:hover .carousel-nav {
			opacity: 1;
		}

		.carousel-nav:hover {
			background: rgba(0, 0, 0, .85);
		}

		.carousel-nav.prev {
			left: 0;
		}

		.carousel-nav.next {
			right: 0;
		}

		.carousel-dots {
			position: absolute;
			bottom: 6px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			gap: 5px;
			z-index: 2;
		}

		.carousel-dot {
			width: 6px;
			height: 6px;
			background: rgba(255, 255, 255, .3);
			border: none;
			cursor: pointer;
			transition: background .15s;
		}

		.carousel-dot.active {
			background: rgba(255, 255, 255, .9);
		}

		.carousel-counter {
			position: absolute;
			top: 6px;
			right: 8px;
			font-size: 10px;
			font-family: var(--mono);
			color: rgba(255, 255, 255, .8);
			background: rgba(0, 0, 0, .55);
			padding: 1px 6px;
			z-index: 2;
			pointer-events: none;
		}

		.carousel-empty {
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			color: var(--text-3);
			font-family: var(--mono);
			font-size: 11px;
		}

		/* ─── card body ──────────────────────────────────────────── */
		.card-body {
			padding: 12px 16px;
			flex: 1;
			display: flex;
			flex-direction: column;
			gap: 6px;
		}

		.card-header {
			display: flex;
			align-items: flex-start;
			gap: 8px;
			justify-content: space-between;
		}

		.card-handle {
			display: flex;
			align-items: center;
			gap: 6px;
			min-width: 0;
		}

		.card-handle .avatar {
			width: 22px;
			height: 22px;
			object-fit: cover;
			flex-shrink: 0;
			background: var(--surface-2);
		}

		.card-handle a {
			color: var(--accent);
			text-decoration: none;
			font-weight: 600;
			font-size: 13px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.card-handle a:hover {
			text-decoration: underline;
		}

		.card-badges {
			display: flex;
			gap: 4px;
			align-items: center;
			flex-shrink: 0;
			flex-wrap: wrap;
			justify-content: flex-end;
		}

		.badge {
			font-size: 9px;
			font-family: var(--mono);
			padding: 1px 6px;
			border: 1px solid;
			white-space: nowrap;
			text-transform: lowercase;
			letter-spacing: .02em;
		}

		.badge-price {
			border-color: var(--amber);
			color: var(--amber);
		}

		.badge-open {
			border-color: var(--green);
			color: var(--green);
		}

		.badge-closed {
			border-color: var(--border);
			color: var(--text-3);
			opacity: .45;
		}

		.badge-works {
			border-color: var(--border);
			color: var(--text-3);
		}

		.badge-loading {
			border-color: var(--border);
			color: var(--text-3);
			opacity: .4;
			animation: pulse 1.5s infinite;
		}

		@keyframes pulse {

			0%,
			100% {
				opacity: .4
			}

			50% {
				opacity: .15
			}
		}

		.card-notes {
			font-size: 12px;
			color: var(--text-2);
			line-height: 1.55;
			white-space: pre-wrap;
			word-break: break-word;
		}

		.card-tags {
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
		}

		.card-tag {
			font-size: 10px;
			font-family: var(--mono);
			padding: 1px 8px;
			border: 1px solid var(--border);
			color: var(--text-3);
			text-transform: lowercase;
		}

		/* ─── expand toggle ──────────────────────────────────────── */
		.card-toggle {
			font-family: var(--mono);
			font-size: 10px;
			padding: 5px 0;
			border: none;
			background: none;
			color: var(--text-3);
			cursor: pointer;
			text-align: left;
			letter-spacing: .02em;
			margin-top: auto;
			transition: color .12s;
		}

		.card-toggle:hover {
			color: var(--accent);
		}

		/* ─── card detail panel ──────────────────────────────────── */
		.card-detail {
			border-top: 1px solid var(--border-lt);
			padding: 0 16px;
			max-height: 0;
			overflow: hidden;
			transition: max-height .3s ease, padding .3s ease;
		}

		.card-detail.open {
			max-height: 2400px;
			padding: 14px 16px;
			overflow-y: auto;
		}

		.card-detail h4 {
			font-size: 10px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: .06em;
			color: var(--text-3);
			margin: 12px 0 6px;
			padding-bottom: 4px;
			border-bottom: 1px solid var(--border-lt);
		}

		.card-detail h4:first-child {
			margin-top: 0;
		}

		.detail-loading {
			font-size: 11px;
			color: var(--text-3);
			font-family: var(--mono);
		}

		.detail-desc {
			font-size: 11px;
			color: var(--text-3);
			line-height: 1.45;
			white-space: pre-wrap;
			word-break: break-word;
			max-height: 72px;
			overflow: hidden;
			margin-bottom: 4px;
		}

		/* ─── detail: price history ──────────────────────────────── */
		.ph-genre {
			margin-bottom: 10px;
		}

		.ph-genre:last-child {
			margin-bottom: 0;
		}

		.ph-genre-head {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 3px;
		}

		.genre-tag {
			font-size: 10px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: .04em;
			color: var(--text-2);
			padding: 1px 6px;
			border: 1px solid var(--border);
			background: var(--surface-2);
		}

		.ph-list {
			list-style: none;
		}

		.ph-list li {
			display: flex;
			justify-content: space-between;
			padding: 2px 0;
			font-size: 11px;
			border-bottom: 1px solid var(--border-lt);
		}

		.ph-list li:last-child {
			border-bottom: none;
		}

		.ph-val {
			font-family: var(--mono);
			font-weight: 600;
			color: var(--text);
		}

		.ph-date {
			font-family: var(--mono);
			font-size: 10px;
			color: var(--text-3);
		}

		.ph-up {
			color: var(--red);
		}

		.ph-down {
			color: var(--green);
		}

		/* ─── detail: works grid ─────────────────────────────────── */
		.detail-works {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
			gap: 3px;
			margin-top: 4px;
		}

		.detail-work {
			display: block;
			text-decoration: none;
			border: 1px solid var(--border-lt);
			overflow: hidden;
			transition: border-color .12s;
		}

		.detail-work:hover {
			border-color: var(--accent);
		}

		.detail-work img {
			display: block;
			width: 100%;
			aspect-ratio: 1;
			object-fit: cover;
			background: var(--surface-2);
		}

		.detail-work-ph {
			width: 100%;
			aspect-ratio: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			background: var(--surface-2);
			font-size: 9px;
			color: var(--text-3);
			font-family: var(--mono);
			padding: 4px;
			text-align: center;
			word-break: break-all;
		}

		.detail-work-info {
			padding: 2px 4px;
			font-size: 9px;
			font-family: var(--mono);
			color: var(--text-3);
			border-top: 1px solid var(--border-lt);
			display: flex;
			justify-content: space-between;
		}

		.detail-work-nsfw {
			color: var(--amber);
			font-weight: 700;
		}

		/* ─── detail: links ──────────────────────────────────────── */
		.detail-links {
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
			margin-top: 4px;
		}

		.detail-link {
			display: inline-flex;
			align-items: center;
			gap: 3px;
			padding: 2px 8px;
			border: 1px solid var(--border);
			background: var(--surface-2);
			color: var(--text-2);
			text-decoration: none;
			font-size: 10px;
			font-family: var(--mono);
			transition: border-color .12s, color .12s;
		}

		.detail-link:hover {
			border-color: var(--accent);
			color: var(--accent);
		}

		.detail-link-label {
			font-weight: 700;
			text-transform: uppercase;
			font-size: 8px;
			letter-spacing: .03em;
			color: var(--text-3);
		}

		/* ─── detail: flags ──────────────────────────────────────── */
		.detail-flag-list {
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
			margin-top: 4px;
		}

		.detail-flag {
			font-size: 10px;
			font-family: var(--mono);
			padding: 1px 8px;
			border: 1px solid var(--border);
			color: var(--text-3);
			text-transform: lowercase;
		}

		.detail-flag-true {
			border-color: var(--amber);
			color: var(--amber);
		}

		.detail-flag-false {
			border-color: var(--border);
			color: var(--text-3);
			opacity: .5;
		}

		/* ─── lightbox ───────────────────────────────────────────── */
		.lightbox {
			position: fixed;
			inset: 0;
			z-index: 1000;
			background: rgba(0, 0, 0, .92);
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: zoom-out;
			opacity: 0;
			pointer-events: none;
			transition: opacity .2s;
		}

		.lightbox.open {
			opacity: 1;
			pointer-events: auto;
		}

		.lightbox img {
			max-width: 95vw;
			max-height: 95vh;
			object-fit: contain;
			cursor: default;
		}

		/* ─── empty / message ────────────────────────────────────── */
		.msg {
			grid-column: 1 / -1;
			text-align: center;
			padding: 64px 24px;
			color: var(--text-3);
			font-size: 13px;
		}

		/* ─── scrollbar ──────────────────────────────────────────── */
		::-webkit-scrollbar {
			width: 5px;
			height: 5px;
		}

		::-webkit-scrollbar-track {
			background: var(--bg);
		}

		::-webkit-scrollbar-thumb {
			background: var(--border);
		}

		/* ─── responsive ─────────────────────────────────────────── */
		@media (max-width: 860px) {
			.grid {
				grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
			}
		}

		@media (max-width: 500px) {
			.grid {
				grid-template-columns: 1fr;
			}

			.toolbar input[type="search"] {
				width: 100%;
			}

			.card-header {
				flex-direction: column;
				gap: 4px;
			}
		}
	</style>
</head>

<body>

	<header>
		<h1>BOOKMARKS</h1>
		<div class="header-links">
			<a href="index.html">&larr; Tracker</a>
		</div>
	</header>

	<div class="toolbar">
		<input type="search" id="search" placeholder="Search artist or notes &hellip;" spellcheck="false">
		<div class="toolbar-right">
			<button class="sort-btn active" data-sort="default" id="sort-default">Default</button>
			<button class="sort-btn" data-sort="name" id="sort-name">A&ndash;Z</button>
			<button class="sort-btn" data-sort="price" id="sort-price">Price</button>
		</div>
	</div>

	<div class="tag-bar" id="tag-bar"></div>

	<div class="count-bar" id="count-bar">
		<span>Loading&hellip;</span>
		<span class="skeb-status-msg" id="skeb-status"></span>
	</div>

	<div class="grid" id="grid">
		<div class="msg">Loading bookmarks&hellip;</div>
	</div>

	<div class="lightbox" id="lightbox" tabindex="-1">
		<img id="lightbox-img" src="" alt="">
	</div>

	<script>
		// @ts-nocheck
		"use strict";

		const $ = (s) => document.querySelector(s);
		const $$ = (s) => document.querySelectorAll(s);

		function esc(s) {
			if (!s) return "";
			const d = document.createElement("div");
			d.textContent = s;
			return d.innerHTML;
		}

		function fmtYen(n) {
			return n != null ? "\u00a5" + Number(n).toLocaleString() : "\u2014";
		}

		function fmtDate(v) {
			if (!v) return "\u2014";
			const d = new Date(typeof v === "number" ? v * 1000 : v);
			if (isNaN(d)) return "\u2014";
			return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
		}

		function truncate(s, n) {
			if (!s) return "";
			return s.length > n ? s.substring(0, n) + "\u2026" : s;
		}

		function screenName(link) {
			const m = (link || "").match(/@([^\/\?#]+)/);
			return m ? m[1] : "";
		}

		/* ================================================================ */
		const BM = {
			raw: [],
			filtered: [],
			allTags: [],
			activeTags: new Set(),
			search: "",
			sortMode: "default",   // default | name | price

			skebCache: {},          // name -> data | {_error}
			skebPending: new Set(),
			skebDone: 0,
			expanded: new Set(),

			fileMap: null,          // screen_name -> file  (from index pages)

			/* ── bootstrap ─────────────────────────────────────────── */
			async init() {
				try {
					var r = await fetch("https://raw.githubusercontent.com/Elfiawesome/skeb-archiver/refs/heads/main/bookmark/bookmark-data.json");
					if (!r.ok) throw new Error("HTTP " + r.status);
					this.raw = await r.json();
				} catch (e) {
					$("#grid").innerHTML =
						'<div class="msg">Failed to load bookmark-data.json &mdash; ' + esc(e.message) + "</div>";
					return;
				}

				// collect tags
				const ts = new Set();
				for (const b of this.raw) (b.tags || []).forEach(t => ts.add(t));
				this.allTags = [...ts].sort();

				this.bind();
				this.update();

				// eagerly fetch skeb data for all bookmarks (badges)
				this.loadFileMap().then(() => this.fetchAllSkeb());
			},

			/* ── file-map: load index pages to map screen_name → file ── */
			async loadFileMap() {
				try {
					const idx = await this.smartFetch("api/index.json");
					if (!idx.ok) return;
					const meta = await idx.json();
					const map = {};
					const tasks = [];
					for (let i = 0; i < (meta.total_pages || 0); i++) {
						tasks.push(
							this.smartFetch("api/pages/" + i + ".json.gz")
								.then(r => {
									if (!r.ok) return;
									const dec = r.body.pipeThrough(new DecompressionStream("gzip"));
									return new Response(dec).json();
								})
								.then(d => {
									if (d && d.users) d.users.forEach(u => { map[u.screen_name] = u.file; });
								})
								.catch(() => { })
						);
					}
					await Promise.all(tasks);
					this.fileMap = map;
				} catch (_) { /* proceed without map */ }
			},

			async smartFetch(url) {
				let r = await fetch(url).catch(() => ({ ok: false }));
				if (!r.ok) {
					r = await fetch(
						"https://raw.githubusercontent.com/Elfiawesome/skeb-archiver/refs/heads/main/docs/" + url
					).catch(() => ({ ok: false }));
				}
				return r;
			},

			/* ── fetch skeb JSON for one artist ────────────────────── */
			async fetchSkeb(name) {
				if (this.skebCache[name]) return this.skebCache[name];

				// determine file name
				const file = (this.fileMap && this.fileMap[name]) || name;

				let r = await this.smartFetch("skeb/" + encodeURIComponent(file) + ".json");
				if (!r.ok && file !== name) {
					// fallback: try screen_name directly
					r = await this.smartFetch("skeb/" + encodeURIComponent(name) + ".json");
				}
				if (!r.ok) return null;
				return await r.json();
			},

			async fetchAllSkeb() {
				const names = this.raw.map(b => screenName(b.link)).filter(Boolean);
				this.skebDone = 0;
				this.renderSkebStatus(names.length);

				const run = async (name) => {
					try {
						const data = await this.fetchSkeb(name);
						if (data) this.skebCache[name] = data;
						else this.skebCache[name] = { _error: "not found" };
					} catch (e) {
						this.skebCache[name] = { _error: e.message };
					}
					this.skebDone++;
					this.renderSkebStatus(names.length);
					this.renderBadges(name);
					// if detail is open, re-render it
					if (this.expanded.has(name) && !this.skebCache[name]._error) {
						this.renderDetailInner(name);
					}
				};

				// fetch 4 at a time
				const pool = [];
				for (const name of names) {
					const p = run(name);
					pool.push(p);
					if (pool.length >= 4) await Promise.race(pool).catch(() => { });
					// clean finished
					for (let i = pool.length - 1; i >= 0; i--) {
						// Promise.race doesn't remove, so just await all at end
					}
				}
				await Promise.all(pool);
			},

			renderSkebStatus(total) {
				const el = $("#skeb-status");
				if (this.skebDone >= total) {
					const ok = Object.values(this.skebCache).filter(d => !d._error).length;
					el.textContent = ok + "/" + total + " skeb profiles loaded";
				} else {
					el.textContent = "loading skeb data " + this.skebDone + "/" + total + "\u2026";
				}
			},

			/* ── events ────────────────────────────────────────────── */
			bind() {
				let t;
				$("#search").addEventListener("input", (e) => {
					clearTimeout(t);
					t = setTimeout(() => { this.search = e.target.value.toLowerCase().trim(); this.update(); }, 180);
				});

				// sort buttons
				$$("#sort-default, #sort-name, #sort-price").forEach(btn => {
					btn.addEventListener("click", () => {
						this.sortMode = btn.dataset.sort;
						$$(".sort-btn").forEach(b => b.classList.toggle("active", b === btn));
						this.update();
					});
				});

				// lightbox
				const lb = $("#lightbox");
				lb.addEventListener("click", () => lb.classList.remove("open"));
				document.addEventListener("keydown", (e) => {
					if (e.key === "Escape") lb.classList.remove("open");
				});
			},

			/* ── filter + sort ─────────────────────────────────────── */
			filter() {
				let list = this.raw;

				if (this.search) {
					list = list.filter(b => {
						const n = screenName(b.link).toLowerCase();
						const notes = (b.notes || "").toLowerCase();
						const tags = (b.tags || []).join(" ").toLowerCase();
						return n.includes(this.search) || notes.includes(this.search) || tags.includes(this.search);
					});
				}

				if (this.activeTags.size) {
					list = list.filter(b => {
						return (b.tags || []).some(t => this.activeTags.has(t));
					});
				}

				// sort
				const self = this;
				if (this.sortMode === "name") {
					list = list.slice().sort((a, b) => {
						const na = screenName(a.link).toLowerCase();
						const nb = screenName(b.link).toLowerCase();
						return na < nb ? -1 : na > nb ? 1 : 0;
					});
				} else if (this.sortMode === "price") {
					list = list.slice().sort((a, b) => {
						const pa = self.getArtPrice(screenName(a.link));
						const pb = self.getArtPrice(screenName(b.link));
						if (pa == null && pb == null) return 0;
						if (pa == null) return 1;
						if (pb == null) return -1;
						return pa - pb;
					});
				}

				this.filtered = list;
			},

			getArtPrice(name) {
				const d = this.skebCache[name];
				if (!d || d._error) return null;
				const cp = d.current_prices || {};
				return cp.art ?? cp.comic ?? cp.voice ?? cp.novel ?? null;
			},

			/* ── render pipeline ───────────────────────────────────── */
			update() {
				this.filter();
				this.renderTagBar();
				this.renderCount();
				this.renderGrid();
			},

			renderTagBar() {
				const el = $("#tag-bar");
				if (!this.allTags.length) { el.innerHTML = ""; return; }
				let h = '<span class="tag-bar-label">Tags</span>';
				for (const tag of this.allTags) {
					const on = this.activeTags.has(tag);
					h += '<button class="tag-btn' + (on ? " active" : "") +
						'" data-tag="' + esc(tag) + '">' + esc(tag) + "</button>";
				}
				el.innerHTML = h;
				el.querySelectorAll(".tag-btn").forEach(btn => {
					btn.addEventListener("click", () => {
						const t = btn.dataset.tag;
						if (this.activeTags.has(t)) this.activeTags.delete(t);
						else this.activeTags.add(t);
						this.update();
					});
				});
			},

			renderCount() {
				const el = $("#count-bar");
				el.querySelector("span:first-child").innerHTML =
					"Showing <strong>" + this.filtered.length + "</strong> of <strong>" +
					this.raw.length + "</strong> bookmarks";
			},

			/* ── grid ──────────────────────────────────────────────── */
			renderGrid() {
				const el = $("#grid");
				if (!this.filtered.length) {
					el.innerHTML = '<div class="msg">No bookmarks match your filters</div>';
					return;
				}
				el.innerHTML = "";
				for (const b of this.filtered) el.appendChild(this.buildCard(b));
			},

			/* ── card builder ──────────────────────────────────────── */
			buildCard(b) {
				const name = screenName(b.link);
				const card = document.createElement("div");
				card.className = "card";
				card.dataset.name = name;

				const images = b.images || [];

				// ── carousel ────────────────────
				const cDiv = document.createElement("div");
				cDiv.className = "carousel";
				cDiv.dataset.idx = "0";

				if (!images.length) {
					cDiv.innerHTML = '<div class="carousel-empty">no images</div>';
				} else {
					let ch = "";
					if (images.length > 1)
						ch += '<span class="carousel-counter">1/' + images.length + "</span>";
					for (let i = 0; i < images.length; i++) {
						ch += '<img class="carousel-img' + (i === 0 ? " active" : "") +
							'" src="' + esc(images[i]) + '" loading="lazy" alt=""' +
							' data-i="' + i + '" onerror="this.style.visibility=\'hidden\'">';
					}
					if (images.length > 1) {
						ch += '<button class="carousel-nav prev" aria-label="Previous">\u2039</button>';
						ch += '<button class="carousel-nav next" aria-label="Next">\u203a</button>';
						ch += '<div class="carousel-dots">';
						for (let i = 0; i < images.length; i++)
							ch += '<button class="carousel-dot' + (i === 0 ? " active" : "") +
								'" data-i="' + i + '"></button>';
						ch += "</div>";
					}
					cDiv.innerHTML = ch;
					this.wireCarousel(cDiv, images.length);
				}
				card.appendChild(cDiv);

				// ── body ────────────────────────
				const body = document.createElement("div");
				body.className = "card-body";

				// header row
				let hdr = '<div class="card-header"><div class="card-handle">';
				const skd = this.skebCache[name];
				if (skd && !skd._error && skd.avatar_url) {
					hdr += '<img class="avatar" src="' + esc(skd.avatar_url) +
						'" onerror="this.style.display=\'none\'">';
				}
				hdr += '<a href="' + esc(b.link) + '" target="_blank" rel="noopener">@' +
					esc(name) + "</a></div>";
				hdr += '<div class="card-badges" id="badges-' + esc(name) + '">';
				hdr += this.badgesHTML(name);
				hdr += "</div></div>";
				body.innerHTML = hdr;

				// notes
				if (b.notes) {
					const n = document.createElement("div");
					n.className = "card-notes";
					n.textContent = b.notes;
					body.appendChild(n);
				}

				// tags
				if (b.tags && b.tags.length) {
					const tDiv = document.createElement("div");
					tDiv.className = "card-tags";
					for (const t of b.tags)
						tDiv.innerHTML += '<span class="card-tag">' + esc(t) + "</span>";
					body.appendChild(tDiv);
				}

				// expand toggle
				const tog = document.createElement("button");
				tog.className = "card-toggle";
				tog.textContent = this.expanded.has(name) ? "\u25be Hide skeb data" : "\u25b8 Show skeb data";
				tog.addEventListener("click", () => this.toggleDetail(name, card, tog));
				body.appendChild(tog);

				card.appendChild(body);

				// ── detail panel ────────────────
				const det = document.createElement("div");
				det.className = "card-detail" + (this.expanded.has(name) ? " open" : "");
				det.id = "detail-" + name;
				if (this.expanded.has(name)) {
					det.innerHTML = this.detailHTML(name);
				}
				card.appendChild(det);

				return card;
			},

			/* ── carousel wiring ───────────────────────────────────── */
			wireCarousel(el, total) {
				const go = (idx) => {
					idx = ((idx % total) + total) % total;
					el.dataset.idx = idx;
					el.querySelectorAll(".carousel-img").forEach((img, i) =>
						img.classList.toggle("active", i === idx));
					el.querySelectorAll(".carousel-dot").forEach((dot, i) =>
						dot.classList.toggle("active", i === idx));
					const c = el.querySelector(".carousel-counter");
					if (c) c.textContent = (idx + 1) + "/" + total;
				};

				const prev = el.querySelector(".prev");
				const next = el.querySelector(".next");
				if (prev) prev.addEventListener("click", (e) => { e.stopPropagation(); go(+el.dataset.idx - 1); });
				if (next) next.addEventListener("click", (e) => { e.stopPropagation(); go(+el.dataset.idx + 1); });
				el.querySelectorAll(".carousel-dot").forEach(dot =>
					dot.addEventListener("click", (e) => { e.stopPropagation(); go(+dot.dataset.i); }));

				// lightbox on image click
				el.querySelectorAll(".carousel-img").forEach(img => {
					img.style.cursor = "zoom-in";
					img.addEventListener("click", (e) => {
						e.stopPropagation();
						$("#lightbox-img").src = img.src;
						$("#lightbox").classList.add("open");
					});
				});
			},

			/* ── badges ────────────────────────────────────────────── */
			badgesHTML(name) {
				const d = this.skebCache[name];
				if (!d) return '<span class="badge badge-loading">\u22ef</span>';
				if (d._error) return "";

				let h = "";
				const price = this.getArtPrice(name);
				if (price != null) h += '<span class="badge badge-price">' + fmtYen(price) + "</span>";
				h += '<span class="badge ' + (d.acceptable ? "badge-open" : "badge-closed") + '">' +
					(d.acceptable ? "open" : "closed") + "</span>";
				if (d.total_works) h += '<span class="badge badge-works">' + d.total_works + " works</span>";
				return h;
			},

			renderBadges(name) {
				const el = document.getElementById("badges-" + name);
				if (el) el.innerHTML = this.badgesHTML(name);
				// also try to render avatar if we didn't have it
				const card = document.querySelector('.card[data-name="' + name + '"]');
				if (!card) return;
				const handle = card.querySelector(".card-handle");
				if (!handle) return;
				const d = this.skebCache[name];
				if (d && !d._error && d.avatar_url && !handle.querySelector(".avatar")) {
					const img = document.createElement("img");
					img.className = "avatar";
					img.src = d.avatar_url;
					img.onerror = function () { this.style.display = "none"; };
					handle.insertBefore(img, handle.firstChild);
				}
			},

			/* ── detail expand / collapse ──────────────────────────── */
			toggleDetail(name, card, toggle) {
				const det = card.querySelector(".card-detail");
				if (this.expanded.has(name)) {
					this.expanded.delete(name);
					det.classList.remove("open");
					toggle.textContent = "\u25b8 Show skeb data";
					return;
				}
				this.expanded.add(name);
				det.classList.add("open");
				toggle.textContent = "\u25be Hide skeb data";
				det.innerHTML = this.detailHTML(name);
			},

			renderDetailInner(name) {
				const det = document.getElementById("detail-" + name);
				if (det && this.expanded.has(name)) det.innerHTML = this.detailHTML(name);
			},

			/* ── detail content HTML ───────────────────────────────── */
			detailHTML(name) {
				const d = this.skebCache[name];
				if (!d) return '<span class="detail-loading">Loading skeb data\u2026</span>';
				if (d._error) return '<span class="detail-loading">No skeb data found for @' + esc(name) + "</span>";

				let h = "";

				// ── description
				if (d.description) {
					h += "<h4>Bio</h4>";
					h += '<div class="detail-desc">' + esc(truncate(d.description, 300)) + "</div>";
				}

				// ── flags
				const flags = d.flags || {};
				const fe = Object.entries(flags);
				if (fe.length) {
					h += "<h4>Flags</h4><div class='detail-flag-list'>";
					for (const [k, v] of fe) {
						const cls = v ? "detail-flag detail-flag-true" : "detail-flag detail-flag-false";
						const val = typeof v === "boolean" ? "" : ": " + v;
						h += '<span class="' + cls + '">' + esc(k) + esc(String(val)) + "</span>";
					}
					h += "</div>";
				}

				// ── price history
				const ph = d.price_history || {};
				const genres = Object.keys(ph);
				if (genres.length) {
					h += "<h4>Price History</h4>";
					for (const genre of genres) {
						const entries = ph[genre] || [];
						if (!entries.length) continue;
						h += '<div class="ph-genre"><div class="ph-genre-head">' +
							'<span class="genre-tag">' + esc(genre) + "</span></div>";
						h += '<ul class="ph-list">';
						for (let i = entries.length - 1; i >= 0; i--) {
							const e = entries[i];
							let cls = "";
							if (i > 0) {
								const prev = entries[i - 1].amount || 0;
								if (e.amount > prev) cls = " ph-up";
								else if (e.amount < prev) cls = " ph-down";
							}
							h += '<li><span class="ph-val' + cls + '">' + fmtYen(e.amount) +
								'</span><span class="ph-date">' + fmtDate(e.recorded_at) + "</span></li>";
						}
						h += "</ul></div>";
					}
				}

				// ── works
				const works = (d.profile && d.profile.received_works) || [];
				if (works.length) {
					const max = Math.min(works.length, 18);
					h += "<h4>Works \u2014 " + max + (works.length > max ? " of " + works.length : "") + "</h4>";
					h += '<div class="detail-works">';
					for (let i = 0; i < max; i++) {
						const w = works[i];
						const path = w.path || "";
						let src = "";
						for (const key of ["thumbnail_image_urls", "private_thumbnail_image_urls"]) {
							const urls = w[key];
							if (urls && urls.src) { src = urls.src; break; }
						}
						h += '<a class="detail-work" href="https://skeb.jp' + esc(path) +
							'" target="_blank" rel="noopener">';
						if (src) {
							h += '<img src="' + esc(src) + '" loading="lazy" alt=""' +
								' onerror="this.style.visibility=\'hidden\'">';
						} else {
							h += '<div class="detail-work-ph">' + esc(path.split("/").pop() || "?") + "</div>";
						}
						h += '<div class="detail-work-info"><span>' + esc(w.genre || "") + "</span>";
						if (w.nsfw) h += '<span class="detail-work-nsfw">NSFW</span>';
						h += "</div></a>";
					}
					h += "</div>";
				}

				// ── links
				if (d.profile) {
					const links = [];
					const seen = new Set();
					for (const sl of (d.profile.user_service_links || [])) {
						const url = sl.url || "";
						if (url && !seen.has(url)) {
							links.push({ label: (sl.provider || "link").toUpperCase(), url: url, name: sl.screen_name || "" });
							seen.add(url);
						}
					}
					if (d.profile.url && !seen.has(d.profile.url)) {
						links.push({ label: "Website", url: d.profile.url, name: "" });
						seen.add(d.profile.url);
					}
					const PLAT = {
						pixiv_id: ["Pixiv", "https://www.pixiv.net/users/{}"],
						nijie_id: ["Nijie", "https://nijie.info/members.php?id={}"],
						booth_id: ["BOOTH", "https://{}.booth.pm"],
						fantia_id: ["Fantia", "https://fantia.jp/fanclubs/{}"],
						fanbox_id: ["Fanbox", "https://{}.fanbox.cc"],
						youtube_id: ["YouTube", "https://youtube.com/channel/{}"],
						patreon_id: ["Patreon", "https://patreon.com/{}"],
						skima_id: ["SKIMA", "https://skima.jp/profile?id={}"],
						coconala_id: ["Coconala", "https://coconala.com/users/{}"],
						dlsite_id: ["DLsite", "https://www.dlsite.com/home/circle/profile/=/maker_id/{}"],
						fanza_id: ["FANZA", "https://www.dmm.co.jp/dc/doujin/-/detail/=/keyword={}"],
					};
					for (const key in PLAT) {
						const pid = d.profile[key];
						if (pid) {
							const url = PLAT[key][1].replaceAll("{}", pid);
							if (!seen.has(url)) { links.push({ label: PLAT[key][0], url, name: pid }); seen.add(url); }
						}
					}
					if (links.length) {
						h += "<h4>Links</h4><div class='detail-links'>";
						for (const lk of links) {
							h += '<a class="detail-link" href="' + esc(lk.url) +
								'" target="_blank" rel="noopener"><span class="detail-link-label">' +
								esc(lk.label) + "</span> " + esc(lk.name || lk.label) + "</a>";
						}
						h += "</div>";
					}
				}

				return h || '<span class="detail-loading">No additional data</span>';
			},
		};

		document.addEventListener("DOMContentLoaded", () => BM.init());
	</script>
