name: Sync site/ to archive branch

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'   # run only when site/ changes

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all branches and history

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync site/ into archive branch root
        run: |
          # Switch to archive branch
          git checkout archive

          # Pull the site/ directory from the main branch into this working tree
          git checkout main -- site/

          # Copy everything from site/ into the current directory,
          # preserving the existing api/ folder untouched.
          # --delete removes files in root that no longer exist in site/,
          # but --exclude='api/' prevents api/ from being deleted.
          rsync -av --delete site/ ./ --exclude='api/'

          # Remove the temporary site/ folder
          rm -rf site/

          # Stage all changes (new, modified, deleted files)
          git add -A

          # Only commit and push if something changed
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync site/ from main branch [skip ci]"
            git push origin archive
          fi