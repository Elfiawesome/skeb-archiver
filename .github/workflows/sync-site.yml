name: Sync site/ to archive branch

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'       # only run when the site folder changes

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch (to get new site files)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Checkout archive branch (target)
        uses: actions/checkout@v4
        with:
          ref: archive
          path: archive-branch

      - name: Copy site contents to archive root
        run: |
          cp -r main-branch/site/* archive-branch/

      - name: Commit and push changes
        run: |
          cd archive-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync site/ from main branch"
            git push origin archive
          fi