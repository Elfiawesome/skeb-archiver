<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Skeb Tracker — Album Editor</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="editor.css">
	<script src="https://code.iconify.design/iconify-icon/3.0.2/iconify-icon.min.js"></script>
</head>
<body>

<header>
	<div class="header-left">
		<div class="logo">Skeb <span>Tracker</span></div>
		<a href="index.html" class="editor-link-btn" title="Back to tracker">
			<iconify-icon icon="mdi:arrow-left"></iconify-icon>
		</a>
	</div>
	<div class="stats-badge" id="editorStats">
		<iconify-icon icon="mdi:pencil-box-outline"></iconify-icon>
		<span>Album Editor</span>
	</div>
</header>

<div class="editor-layout">
	<div class="progress-container hidden" id="progressContainer">
		<div class="progress-bar">
			<div class="progress-fill" id="progressFill"></div>
		</div>
	</div>
	<div class="editor-left">
		<div class="editor-section">
			<div class="section-title">Album Metadata</div>
			<div class="meta-edit">
				<input type="text" id="metaLabel" placeholder="Album label" value="Untitled">
				<select id="metaType">
					<option value="curated">Curated</option>
					<option value="reports">Reports</option>
				</select>
				<button id="btnDownload" class="primary">Download</button>
			</div>
		</div>

		<div class="editor-section">
			<div class="section-title">Search &amp; Add</div>
			<div class="search-row">
				<input type="text" class="search-input" id="editorSearch" placeholder="Search to add...">
				<button id="btnLoadData">Load Data</button>
			</div>
			<div class="search-results" id="searchResults"></div>
		</div>

		<div class="editor-section upload-section">
			<div class="upload-zone" id="uploadZone">
				<input type="file" id="fileInput" accept=".album" style="display:none">
				<p>Drop .album file here</p>
			</div>
		</div>
	</div>

	<div class="editor-right">
		<div class="editor-section">
			<div class="section-title">
				Album Entries
				<span class="entry-count" id="entryCount">0</span>
			</div>
			<div id="detailPanel"></div>
			<div class="album-entries" id="albumEntries"></div>
		</div>
	</div>
</div>

<script>var App = {};</script>
<script src="js/utils.js"></script>
<script src="js/query.js"></script>
<script src="js/data.js"></script>
<script src="editor.js"></script>
</body>
</html>
